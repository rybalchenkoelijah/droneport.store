<!-- @dsCard group="Дії" height=390 -->
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:20px 16px;padding:16px;align-items:start">
<div style="display:grid;gap:6px;justify-items:start"><button class="btn primary">У кошик</button><small style="color:var(--text-2)">primary, звичайна</small></div>
<div style="display:grid;gap:6px;justify-items:start"><button class="btn primary" style="filter:brightness(1.08)">У кошик</button><small style="color:var(--text-2)">primary, наведення</small></div>
<div style="display:grid;gap:6px;justify-items:start"><button class="btn primary" style="outline:var(--line-focus) solid var(--olive-ink);outline-offset:2px">У кошик</button><small style="color:var(--text-2)">primary, фокус</small></div>
<div style="display:grid;gap:6px;justify-items:start"><button class="btn primary" style="transform:translateY(1px)">У кошик</button><small style="color:var(--text-2)">primary, натиснута</small></div>
<div style="display:grid;gap:6px;justify-items:start"><button class="btn">Шукати на Prom</button><small style="color:var(--text-2)">звичайна</small></div>
<div style="display:grid;gap:6px;justify-items:start"><button class="btn" style="background:var(--fill-strong)">Шукати на Prom</button><small style="color:var(--text-2)">наведення</small></div>
<div style="display:grid;gap:6px;justify-items:start"><button class="btn" style="outline:var(--line-focus) solid var(--olive-ink);outline-offset:2px">Шукати на Prom</button><small style="color:var(--text-2)">фокус</small></div>
<div style="display:grid;gap:6px;justify-items:start"><button class="btn" disabled>Немає в наявності</button><small style="color:var(--text-2)">disabled</small></div>
<div style="display:grid;gap:6px;justify-items:start"><button class="btn ghost">Скасувати</button><small style="color:var(--text-2)">ghost</small></div>
<div style="display:grid;gap:6px;justify-items:start"><button class="btn ghost" style="background:var(--fill)">Скасувати</button><small style="color:var(--text-2)">ghost, наведення</small></div>
<div style="display:grid;gap:6px;justify-items:start"><button class="btn danger">Очистити кошик</button><small style="color:var(--text-2)">danger</small></div>
<div style="display:grid;gap:6px;justify-items:start"><button class="btn danger" style="background:var(--fill-strong)">Очистити кошик</button><small style="color:var(--text-2)">danger, наведення</small></div>
<div style="display:grid;gap:6px;justify-items:start"><button class="btn primary is-loading" aria-busy="true" aria-label="Додаємо в кошик">У кошик</button><small style="color:var(--text-2)">primary, is-loading</small></div>
<div style="display:grid;gap:6px;justify-items:start"><button class="btn is-loading" aria-busy="true" aria-label="Шукаємо">Шукати на Prom</button><small style="color:var(--text-2)">is-loading</small></div>
<div style="display:grid;gap:6px;justify-items:start"><button class="btn primary lg">У кошик</button><small style="color:var(--text-2)">lg, 44px</small></div>
<div style="display:grid;gap:6px;justify-items:start"><a class="link" href="#">Усі статті бази знань</a><small style="color:var(--text-2)">link</small></div>
<div style="display:grid;gap:6px;grid-column:1/-1"><button class="btn block">Додати до порівняння</button><small style="color:var(--text-2)">block, на всю ширину</small></div>
</div>
