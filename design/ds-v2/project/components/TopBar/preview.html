<!-- @dsCard group="Навігація" height=190 -->
<div style="display:flex;flex-wrap:wrap;gap:var(--space-16);align-items:flex-start">
  <div style="width:var(--side)">
    <small style="color:var(--text-2)">Смуга бічної панелі</small>
    <div style="background:var(--bg-side);border-top:var(--line-w) solid var(--line);border-bottom:var(--line-w) solid var(--line)">
      <div class="bar"><span class="wordmark">Дронопорт</span><span class="sp"></span><button class="ib" aria-label="Згорнути панель"><svg class="icon" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="M9 5v14"/></svg></button></div>
    </div>
  </div>
  <div style="width:560px;max-width:100%">
    <small style="color:var(--text-2)">Смуга основної зони</small>
    <div class="main" style="border-top:var(--line-w) solid var(--line)">
      <div class="bar"><button class="ib" aria-label="Меню"><svg class="icon" viewBox="0 0 24 24"><path d="M4 7h16M4 12h10M4 17h16"/></svg></button><span class="bar-title">Як підібрати LiPo до моторів 2207</span><span class="sp"></span><button class="ib" aria-label="Копіювати посилання"><svg class="icon" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M15.5 8.5V6a1.5 1.5 0 0 0-1.5-1.5H6A1.5 1.5 0 0 0 4.5 6v8A1.5 1.5 0 0 0 6 15.5h2.5"/></svg></button><button class="ib" aria-pressed="true" aria-label="Права панель"><svg class="icon" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="M15 5v14"/></svg></button><button class="btn ghost"><svg class="icon sm" viewBox="0 0 24 24"><path d="M12 15V4M8 7.5l4-4 4 4M6 11v8.5h12V11"/></svg>Поділитися</button></div>
    </div>
    <small style="color:var(--text-2);display:block;margin-top:var(--space-12)">Довга назва обрізається, кнопка натиснута (aria-pressed)</small>
    <div class="main" style="border-top:var(--line-w) solid var(--line);width:360px;max-width:100%">
      <div class="bar"><span class="bar-title">Таблиця частот відеопередавачів 5,8 ГГц для швидких розрахунків</span><span class="sp"></span><button class="ib" aria-label="Права панель"><svg class="icon" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="M15 5v14"/></svg></button></div>
    </div>
  </div>
</div>
