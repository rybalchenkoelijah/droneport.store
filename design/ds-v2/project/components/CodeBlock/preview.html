<div class="prose" style="max-width:calc(var(--measure) + 2*var(--space-8));padding:var(--space-4) var(--space-8)">
<small style="color:var(--text-2)">Назва файлу, мова, кнопка копіювання; довгий перший рядок прокручується всередині блоку</small>
<figure class="codeblock" style="margin-top:var(--space-6)">
<figcaption class="codeblock-head"><b>diff.txt</b><span>Betaflight CLI</span><button class="btn ghost" type="button"><svg class="icon sm" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="10" height="11" rx="2"/><path d="M15 9V6a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>Копіювати</button></figcaption>
<pre tabindex="0" role="region" aria-label="Код: diff.txt"><code><span class="cm"># Приклад для плати на STM32F405: приймач ELRS на UART2, двонапрямний DShot600, попередження на 3,5 В і мінімум 3,3 В на банку</span>
serial 1 64 115200 57600 0 115200
set serialrx_provider = CRSF
set motor_pwm_protocol = DSHOT600
set dshot_bidir = ON
set vbat_warning_cell_voltage = 350
set vbat_min_cell_voltage = 330
save</code></pre>
</figure>
<small style="color:var(--text-2)">Лише мова, без назви файлу; кнопка після копіювання й блок у фокусі з клавіатури</small>
<figure class="codeblock" style="margin-top:var(--space-6)">
<figcaption class="codeblock-head"><span>Параметри ArduPilot</span><button class="btn ghost" type="button"><svg class="icon sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Скопійовано</button></figcaption>
<pre tabindex="0" role="region" aria-label="Код: параметри ArduPilot" style="outline:var(--line-focus) solid var(--olive-ink);outline-offset:-2px"><code>BATT_MONITOR,4
BATT_CAPACITY,1300
BATT_LOW_VOLT,21.0
BATT_FS_LOW_ACT,2
MOT_PWM_TYPE,6</code></pre>
</figure>
<small style="color:var(--text-2)">Кнопка: наведення, фокус, помилка копіювання</small>
<div style="display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-16);margin:var(--space-6) 0 var(--space-12)">
<button class="btn ghost" type="button" style="background:var(--fill)"><svg class="icon sm" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="10" height="11" rx="2"/><path d="M15 9V6a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>Копіювати</button>
<button class="btn ghost" type="button" style="outline:var(--line-focus) solid var(--olive-ink);outline-offset:2px"><svg class="icon sm" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="10" height="11" rx="2"/><path d="M15 9V6a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>Копіювати</button>

<pre tabindex="0" role="region" aria-label="Код: команда CLI"><code>diff all</code></pre>
</figure>
</div>
<script>(function(){var root=document.currentScript.previousElementSibling;root.addEventListener('click',function(e){var b=e.target.closest('.codeblock-head .btn');if(!b)return;var code=b.closest('.codeblock').querySelector('code').textContent;var done=function(ok){var t=b.lastChild;var old=t.textContent;t.textContent=ok?'Скопійовано':'Не скопійовано. Виділіть текст вручну';setTimeout(function(){t.textContent=old},2000)};if(navigator.clipboard)navigator.clipboard.writeText(code).then(function(){done(true)},function(){done(false)});else done(false)})})()</script>
