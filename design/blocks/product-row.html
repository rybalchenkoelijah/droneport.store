<!-- Рядок товару в переліку каталогу. Параметри: id, name, sku, cat, stock, stock-class, price. -->
<div class="item"><span><b>{{name}}</b><small><code>{{sku}}</code> · {{cat}}</small></span><span class="stock {{stock-class}}">{{stock}}</span><span class="price num">{{price}}&nbsp;₴</span><button class="btn" type="button">У кошик</button></div>
