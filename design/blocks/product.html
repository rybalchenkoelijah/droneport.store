<!-- Товар у тексті статті. Параметри: id, name, sku, cat, stock (текст), stock-class ("" або low), price. -->
<div class="product">
  <div class="product-main"><span class="plate sm" aria-hidden="true"></span><span><a class="product-name" href="#{{id}}">{{name}}</a><small><code>{{sku}}</code> · {{cat}}</small></span></div>
  <div class="product-buy"><span class="stock {{stock-class}}">{{stock}}</span><span class="price num">{{price}}&nbsp;₴</span><button class="btn" type="button">У кошик</button></div>
</div>
