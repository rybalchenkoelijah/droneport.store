<!-- Товар, якого немає в магазині: без ціни, з пошуком на Prom. Параметри: id, name, sku, cat. -->
<div class="product off">
  <div class="product-main"><span class="plate sm" aria-hidden="true"></span><span><a class="product-name" href="#{{id}}">{{name}}</a><small><code>{{sku}}</code> · {{cat}}</small></span></div>
  <div class="product-buy"><span class="stock none">Немає в нашому магазині</span><a class="btn" href="#prom" rel="noopener">Шукати на Prom<!-- @block icons/external class="sm" --></a></div>
</div>
