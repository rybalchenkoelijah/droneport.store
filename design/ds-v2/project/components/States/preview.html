<!-- @dsCard group="Дані" height=350 -->
<div style="max-width:var(--measure)">
<small style="color:var(--text-2)">Завантаження: .skel у формі двох рядків списку</small>
<div class="items" style="margin-top:var(--space-6)" role="status" aria-label="Завантаження">
<div class="item" style="cursor:default"><div><div class="skel" style="width:55%;margin-bottom:var(--space-8)"></div><div class="skel" style="width:30%"></div></div><span class="skel" style="display:block;width:80px"></span><span class="skel" style="display:block;width:56px"></span><span class="skel" style="display:block;width:72px;height:var(--control)"></span></div>
<div class="item" style="cursor:default"><div><div class="skel" style="width:45%;margin-bottom:var(--space-8)"></div><div class="skel" style="width:25%"></div></div><span class="skel" style="display:block;width:80px"></span><span class="skel" style="display:block;width:56px"></span><span class="skel" style="display:block;width:72px;height:var(--control)"></span></div>
</div>
<small style="color:var(--text-2)">Порожньо: .empty, що робити далі</small>
<p class="empty" style="margin-top:var(--space-6)">За запитом «LP-8S» нічого не знайдено. Спробуйте коротший код або <a class="link" href="#cat-akb">відкрийте категорію «Акумулятори»</a>.</p>
<small style="color:var(--text-2)">Помилка: слово, іконка й колір</small>
<p style="margin-top:var(--space-6);color:var(--danger);display:flex;align-items:center;gap:var(--space-6)"><svg class="icon sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4.5M12 15.8v.2"/></svg><span><b>Помилка.</b> Не вдалося завантажити каталог. Перевірте з’єднання й <button class="link" style="color:inherit;text-decoration:underline">спробуйте ще раз</button>.</span></p>
</div>
