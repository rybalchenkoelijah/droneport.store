<!-- @dsCard group="Форми" height=330 -->
<div style="display:grid;gap:24px;padding:16px;max-width:720px">
<div style="display:grid;gap:6px"><small style="color:var(--text-2)">порожнє, плейсхолдер, .go disabled</small>
<div class="search"><svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><input aria-label="Пошук" placeholder="Пошук: назва, артикул або параметр"><kbd>/</kbd><button class="go" disabled aria-label="Шукати"><svg class="icon" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button></div></div>
<div style="display:grid;gap:6px"><small style="color:var(--text-2)">заповнене, .go активна, рядок стану</small>
<div class="search"><svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><input aria-label="Пошук" value="XT60-PAIR"><button class="go" aria-label="Шукати"><svg class="icon" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button></div>
<div class="status"><span><b>3</b> товари</span><span>Усього на складі: <b>128</b></span><span><kbd>Enter</kbd> шукати</span></div></div>
<div style="display:grid;gap:6px"><small style="color:var(--text-2)">фокус (focus-within: кільце olive-ink)</small>
<div class="search" style="box-shadow:var(--shadow-raised),0 0 0 var(--line-focus) var(--olive-ink)"><svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><input aria-label="Пошук" value="LP-6S-1300"><button class="go" aria-label="Шукати"><svg class="icon" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button></div></div>
</div>
