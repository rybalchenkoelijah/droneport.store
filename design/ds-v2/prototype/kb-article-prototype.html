<!-- PROTOTYPE, throwaway. Interactive knowledge base + catalogue in a shell that ports the Claude app layout, sizes and spacing (measured from a live session). Sample text and data. -->
<title>Дронопорт стаття прототип</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600&family=Martian+Mono:wdth,wght@87.5,400..600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Science+Gothic:slnt,wdth,wght@-10..0,50..200,100..900&display=swap">
<style>
/* Layout and values measured from a live Claude Code session (light theme, 2026-11-20): sidebar 288, right panel 320, header 45, rows 32, prose 15/21, measure 768. Dark values are mirrored, not measured. */
:root{
  --bg:#FFFFFF; --side:#FAFAFA; --raised:#FFFFFF;
  --text:rgba(0,0,0,.9); --text-2:rgba(0,0,0,.6); --text-3:rgba(0,0,0,.465);
  --border:rgba(0,0,0,.08); --ring:rgba(0,0,0,.12);
  --hover:rgba(0,0,0,.05); --selected:rgba(0,0,0,.1); --chip:rgba(0,0,0,.05); --card:rgba(11,11,11,.05);
  --primary:#191919; --on-primary:#FFFFFF; --link:#1757AC;
  --accent:#5C6A30; --on-accent:#FFFFFF;
  --shadow:0 4px 20px rgba(0,0,0,.035);
  --sans:system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:Georgia,"Times New Roman",Times,serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1C1C1C; --side:#181818; --raised:#262626;
  --text:rgba(255,255,255,.9); --text-2:rgba(255,255,255,.6); --text-3:rgba(255,255,255,.465);
  --border:rgba(255,255,255,.08); --ring:rgba(255,255,255,.12);
  --hover:rgba(255,255,255,.05); --selected:rgba(255,255,255,.1); --chip:rgba(255,255,255,.07); --card:rgba(255,255,255,.05);
  --primary:#F3F3F3; --on-primary:#191919; --link:#84B9F3;
  --accent:#8A9A52; --on-accent:#141413; --shadow:0 4px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1C1C; --side:#181818; --raised:#262626;
  --text:rgba(255,255,255,.9); --text-2:rgba(255,255,255,.6); --text-3:rgba(255,255,255,.465);
  --border:rgba(255,255,255,.08); --ring:rgba(255,255,255,.12);
  --hover:rgba(255,255,255,.05); --selected:rgba(255,255,255,.1); --chip:rgba(255,255,255,.07); --card:rgba(255,255,255,.05);
  --primary:#F3F3F3; --on-primary:#191919; --link:#84B9F3;
  --accent:#8A9A52; --on-accent:#141413; --shadow:0 4px 20px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:400 14px/20px var(--sans)}
h1,h2,p,ul,ol{margin:0;padding:0} ul,ol{list-style:none}
a{color:inherit} button,input{font:inherit;color:inherit}
:focus-visible{outline:1px solid #257DE0;outline-offset:1px;box-shadow:0 0 6px 1px rgba(37,125,224,.12)}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ib{display:grid;place-items:center;width:28px;height:28px;border:0;background:none;border-radius:8px;cursor:pointer;color:var(--text)}
.ib:hover{background:var(--hover)}
.ib[aria-pressed="true"]{background:var(--selected)}
.num{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:288px minmax(0,1fr) 320px;height:100%}

/* left */
.side{display:flex;flex-direction:column;background:var(--side);border-right:1px solid var(--border);min-height:0}
.bar{display:flex;align-items:center;gap:4px;height:45px;padding:0 8px;flex:none}
.brand{font:500 20px/20px var(--serif);margin-left:6px}
.side nav{padding:2px 8px 0;flex:none}
.row{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px 0 6px;margin-bottom:2px;border-radius:8px;text-decoration:none;color:var(--text);cursor:pointer;border:0;background:none;width:100%;text-align:left}
.row:hover{background:var(--hover)}
.row[aria-current]{background:var(--selected)}
.row span{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.row .tail{color:var(--text-2);width:16px;height:16px}
.list{flex:1;overflow-y:auto;padding:12px 8px 8px;min-height:0}
.list .row:not(:has(> svg:first-child)){padding-left:8px}
.grp{display:flex;align-items:center;gap:4px;height:24px;padding:0 8px;margin-top:12px;font-size:12px;font-weight:520;color:var(--text-2)}
.grp svg{width:12px;height:12px;stroke-width:1.8}
.user{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;flex:none}
.ava{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:9px;font-weight:435}
.user b{font-weight:435}
.user small{color:var(--text-2);font-size:12px;font-weight:435}
.user .sp,.bar .sp{flex:1}

/* center */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.main .bar{border-bottom:1px solid var(--border);padding:0 8px 0 16px}
.title{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:435;min-width:0}
.title b{font-weight:435;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.share{display:flex;align-items:center;gap:6px;height:28px;padding:4px 9px;border:0;background:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:435}
.share b{font-weight:435}
.share:hover{background:var(--hover)}
.scroll{flex:1;overflow-y:auto;min-height:0}
.col{max-width:816px;margin:0 auto;padding:16px 24px 32px}
.meta{display:flex;align-items:center;gap:6px;color:var(--text-2);font-size:15px;line-height:21px;margin:0 0 16px;flex-wrap:wrap}
.meta a{color:var(--text-2);text-decoration:none} .meta a:hover{color:var(--text)}
.meta svg{width:12px;height:12px;stroke-width:1.8}
article{font-size:15px;line-height:21px}
article h1{font-size:22px;line-height:28px;font-weight:580;margin:4px 0 14px}
article h2{font-size:17px;line-height:24px;font-weight:580;margin:24px 0 10px}
article p{margin:0 0 12px}
article ul{margin:0 0 12px;padding-left:28px;list-style:disc}
article ol{margin:0 0 12px;padding-left:28px;list-style:decimal}
article li{margin:0 0 6px;padding-left:4px}
article b{font-weight:600}
code{font:400 .9em/1 var(--mono);background:var(--chip);border-radius:4px;padding:1px 4px;white-space:nowrap}
.note{background:var(--card);border-radius:12px;padding:12px 16px;margin:0 0 12px}
.acts{display:flex;align-items:center;gap:2px;color:var(--text-2);margin-top:4px;font-size:13px;line-height:19px}
.acts .ib{width:24px;height:24px;border-radius:6px;color:var(--text-2)} .acts svg{width:16px;height:16px} .acts span{margin-left:8px}
.dock{flex:none;padding:0 24px 8px;background:var(--bg)}
.composer{display:flex;align-items:center;gap:8px;max-width:768px;margin:0 auto;min-height:44px;padding:8px 8px 8px 12px;background:var(--raised);border-radius:14px;box-shadow:var(--shadow),0 0 0 1px var(--ring)}
.composer input{flex:1;min-width:0;border:0;background:none;outline:0;font-size:15px;line-height:21px}
.composer input:focus-visible{box-shadow:none}
.composer:focus-within{box-shadow:var(--shadow),0 0 0 1px #257DE0}
.composer input::placeholder{color:var(--text-3)}
.composer svg{color:var(--text-2)}
.go{display:grid;place-items:center;width:28px;height:28px;border:0;border-radius:8px;background:var(--primary);color:var(--on-primary);cursor:pointer}
.go svg{width:16px;height:16px;stroke-width:2;color:inherit}
.status{display:flex;justify-content:flex-end;gap:12px;max-width:768px;margin:6px auto 0;font-size:13px;line-height:20px;font-weight:435;color:var(--text-2)}
.status b{font-weight:435;color:var(--text)}

/* right */
.panel{border-left:1px solid var(--border);padding:0 0 16px;overflow-y:auto;min-height:0}
.panel section{padding:12px 14px 8px}
.panel section+section{border-top:1px solid var(--border)}
.panel h2{display:flex;align-items:center;gap:4px;font-size:13px;line-height:16px;font-weight:435;margin:0 0 8px}
.panel h2 small{margin-left:auto;font-size:13px;font-weight:400;color:var(--text-2)}
.panel h2 svg{width:12px;height:12px;stroke-width:1.8;color:var(--text-2)}
.kv{display:flex;align-items:center;gap:8px;min-height:28px}
.kv svg{width:16px;height:16px;color:var(--text-2)}
.kv span{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.read{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.read b{font-weight:435} .read span{color:var(--text-2);font-size:13px}
.track{height:2px;border-radius:2px;background:var(--selected);margin-bottom:8px;overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--accent)}
.toc a{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:24px;text-decoration:none;color:var(--text-2)}
.toc a:hover{color:var(--text)}
.toc i{width:8px;height:8px;border-radius:2px;background:var(--selected)}
.toc a.on{color:var(--text)} .toc a.on i{background:var(--accent)}
.toc small{font-size:13px;color:var(--text-2)}
.buy{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:8px;align-items:center;min-height:32px;text-decoration:none}
.buy svg{width:16px;height:16px;color:var(--text-2)}
.buy span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.buy small{font-size:13px;color:var(--text-2)}
.cta{display:block;width:100%;height:28px;margin-top:8px;border:0;border-radius:8px;background:var(--primary);color:var(--on-primary);font-size:13px;font-weight:435;cursor:pointer}

@media (max-width:1100px){.app{grid-template-columns:288px minmax(0,1fr)}.panel{display:none}}
@media (max-width:760px){
  html,body{height:auto}
  .app{display:block}
  .side{display:none}
  .main{display:block}
  .main .bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:2;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .scroll{overflow:visible}
  .col{padding-block:16px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .dock{position:sticky;bottom:0;padding-block:8px calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .status,.share b{display:none}
  .panel{display:block;border-left:0;border-top:1px solid var(--border)}
  .panel section{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .kv,.buy,.toc a{min-height:44px}
  .ib,.go{width:44px;height:44px} .cta{height:44px}
}
@media (prefers-reduced-motion:no-preference){.row,.ib,.share{transition:background-color .06s cubic-bezier(.4,0,.2,1)}}
/* interactive additions */
button{font:inherit;color:inherit}
.grp{border:0;background:none;cursor:pointer;width:100%;text-align:left;border-radius:6px}
.grp:hover{color:var(--text)}
.row .tail{opacity:0;border:0;background:none;padding:0;cursor:pointer;display:grid;place-items:center;width:24px;height:24px;border-radius:6px;flex:none}
.row:hover .tail,.row:focus-within .tail,.row .tail.pinned{opacity:1}
.row .tail:hover{background:var(--hover);color:var(--text)}
.row .tail svg{width:16px;height:16px}
.row small{color:var(--text-2);font-size:12px}
.user{border:0;background:none;width:100%;cursor:pointer;text-align:left;border-top:1px solid var(--border)}
.user:hover{background:var(--hover)}
.app.noside{grid-template-columns:minmax(0,1fr) 320px}
.app.nopanel{grid-template-columns:288px minmax(0,1fr)}
.app.noside.nopanel{grid-template-columns:minmax(0,1fr)}
.app.noside .side,.app.nopanel .panel{display:none}
.app:not(.noside) .openside{display:none}
.link{color:var(--link);text-decoration:none;cursor:pointer;background:none;border:0;padding:0}
.link:hover{text-decoration:underline}
.tbl{width:100%;border-collapse:collapse;margin:0 0 12px;font-size:14px;line-height:20px}
.tbl th{text-align:left;font-weight:435;color:var(--text-2);font-size:13px;padding:6px 12px 6px 0;border-bottom:1px solid var(--ring)}
.tbl td{padding:8px 12px 8px 0;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl td:last-child,.tbl th:last-child{padding-right:0;text-align:right;white-space:nowrap}
.wrap{overflow-x:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.chips button{height:28px;padding:0 10px;border-radius:8px;border:0;background:var(--hover);cursor:pointer;font-size:13px;font-weight:435}
.chips button:hover{background:var(--selected)}
.chips button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.items{margin:0 0 12px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:12px;align-items:center;min-height:44px;padding:6px 8px;margin:0 -8px;border-radius:8px;cursor:pointer}
.item:hover{background:var(--hover)}
.item+.item{box-shadow:0 -1px 0 var(--border)}
.item:hover,.item:hover+.item{box-shadow:none}
.item b{font-weight:435;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item small{color:var(--text-2);font-size:13px}
.stock{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2);white-space:nowrap}
.stock i{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.stock.low i{background:#C98500} .stock.none i{display:none}
.price{font-weight:435;white-space:nowrap}
.btn{height:28px;padding:0 10px;border-radius:8px;border:0;cursor:pointer;font-size:13px;font-weight:435;white-space:nowrap;background:var(--hover)}
.btn:hover{background:var(--selected)}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.primary:hover{opacity:.85}
.btn[disabled]{opacity:.45;cursor:default}
.big{font-size:22px;line-height:28px;font-weight:580}
.buyrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:0 0 20px}
.qty{display:inline-flex;align-items:center;gap:2px}
.qty button{width:24px;height:24px;border-radius:6px;border:0;background:none;cursor:pointer;color:var(--text-2)}
.qty button:hover{background:var(--hover);color:var(--text)}
.qty span{min-width:20px;text-align:center}
.buy{border-radius:8px}
.buy .add{width:24px;height:24px;border-radius:6px;border:0;background:none;cursor:pointer;display:grid;place-items:center;color:var(--text-2)}
.buy .add:hover{background:var(--hover);color:var(--text)}
.buy a{color:inherit;text-decoration:none;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer}
.buy a:hover{text-decoration:underline}
.buy{grid-template-columns:16px minmax(0,1fr) auto auto}
.total{display:flex;justify-content:space-between;font-weight:435;padding-top:8px}
.empty{color:var(--text-2);padding:8px 0 16px}
mark{background:rgba(251,179,21,.33);color:inherit;border-radius:2px}
.status span[aria-live]{color:var(--text)}
.scrim{display:none}
@media (max-width:1100px){.app,.app.nopanel{grid-template-columns:288px minmax(0,1fr)}.app.noside,.app.noside.nopanel{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .side{display:flex;position:fixed;inset:0 auto 0 0;width:min(288px,86vw);z-index:5;transform:translateX(-100%);padding-top:env(safe-area-inset-top,0px)}
  .app.drawer .side{transform:none}
  .app.drawer .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:4;border:0}
  .app .openside,.app:not(.noside) .openside{display:grid}
  .app.nopanel .panel{display:none}
  .row,.grp{min-height:44px}
  .item{grid-template-columns:minmax(0,1fr) auto auto}.item .stock{display:none}
}
@media (prefers-reduced-motion:no-preference){.side{transition:transform .2s cubic-bezier(.32,.72,0,1)}}
/* ---- variant switcher (prototype chrome, not part of any variant) ---- */
.main{position:relative}
.status{align-items:center}
.skins{margin-right:auto;display:flex;gap:2px;padding:2px;border-radius:999px;background:#191919;font:500 12px/1 system-ui,sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.skins button{height:24px;padding:0 12px;border:0;border-radius:999px !important;background:none;color:#fff;opacity:.7;cursor:pointer;font:inherit}
.skins button:hover{opacity:1}
.skins button[aria-pressed="true"]{background:#fff;color:#191919;opacity:1}
/* figure shared */
.fig{margin:0 0 12px;display:grid;gap:8px}
.fig svg{width:100%;max-width:340px;height:auto;stroke:none;fill:none}
.fig .c{stroke:var(--text);stroke-width:1.4;fill:none}
.fig .dwg{display:none}
.fig figcaption{color:var(--text-2);font-size:13px}
.poslist{margin:0 0 12px}
.poslist li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.pos{display:none;place-items:center;width:22px;height:22px;border:1px solid var(--text);border-radius:50% !important;font:400 11px/1 var(--mono);flex:none}
.poslist li.hot{background:var(--hover)}

/* ---- Суміжний: Claude shell + own type, olive and drawing conventions ---- */
:root[data-skin="hybrid"]{--sans:"Geologica",system-ui,sans-serif;--mono:"Martian Mono",ui-monospace,monospace;--primary:#5C6A30;--on-primary:#FFFFFF;--link:#4F5A2A}
@media (prefers-color-scheme:dark){:root[data-skin="hybrid"]:not([data-theme="light"]){--primary:#8A9A52;--on-primary:#0E100C;--link:#B4C47A}}
:root[data-skin="hybrid"][data-theme="dark"]{--primary:#8A9A52;--on-primary:#0E100C;--link:#B4C47A}
:root[data-skin="hybrid"] .brand,:root[data-skin="mine"] .brand{font:900 18px/20px "Science Gothic","Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.01em}
:root[data-skin="hybrid"] code,:root[data-skin="mine"] code{font-size:.82em;font-stretch:87.5%}
:root[data-skin="hybrid"] :focus-visible,:root[data-skin="mine"] :focus-visible{outline:2px solid var(--link);outline-offset:2px;box-shadow:none}
:root[data-skin="hybrid"] .fig .dwg,:root[data-skin="mine"] .fig .dwg{display:inline}
:root[data-skin="hybrid"] .fig .c,:root[data-skin="mine"] .fig .c{stroke-width:2}
:root[data-skin="hybrid"] .fig .ax,:root[data-skin="mine"] .fig .ax{stroke:var(--text-2);stroke-width:1;stroke-dasharray:10 4 2 4}
:root[data-skin="hybrid"] .fig .dm,:root[data-skin="mine"] .fig .dm{stroke:var(--text-2);stroke-width:1}
:root[data-skin="hybrid"] .fig text,:root[data-skin="mine"] .fig text{fill:var(--text);font:400 11px var(--mono);stroke:none}
:root[data-skin="hybrid"] .fig .mk,:root[data-skin="mine"] .fig .mk{stroke:var(--text);stroke-width:1;fill:var(--bg)}
:root[data-skin="hybrid"] .pos,:root[data-skin="mine"] .pos{display:grid}

/* ---- Мій: «Креслення ЄСКД» applied to the same screen ---- */
:root[data-skin="mine"]{--desk:#E9EBE7;--rule:#14161A;--bg:#FFFFFF;--side:#FFFFFF;--raised:#FFFFFF;--text:#14161A;--text-2:#4A4E55;--text-3:#4A4E55;--border:#C9CCC8;--ring:#14161A;--hover:#14161A0F;--selected:#14161A17;--chip:transparent;--card:transparent;--primary:#5C6A30;--on-primary:#FFFFFF;--link:#4F5A2A;--accent:#5C6A30;--on-accent:#FFFFFF;--shadow:0 0 0 0 transparent;--sans:"Geologica",system-ui,sans-serif;--mono:"Martian Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root[data-skin="mine"]:not([data-theme="light"]){--desk:#0B0C0E;--rule:#C9CDC4;--bg:#121417;--side:#121417;--raised:#121417;--text:#E4E6E1;--text-2:#A3A8A0;--text-3:#A3A8A0;--border:#2E3236;--ring:#C9CDC4;--hover:#E4E6E10F;--selected:#E4E6E117;--primary:#8A9A52;--on-primary:#0E100C;--link:#B4C47A;--accent:#8A9A52;--on-accent:#0E100C}}
:root[data-skin="mine"][data-theme="dark"]{--desk:#0B0C0E;--rule:#C9CDC4;--bg:#121417;--side:#121417;--raised:#121417;--text:#E4E6E1;--text-2:#A3A8A0;--text-3:#A3A8A0;--border:#2E3236;--ring:#C9CDC4;--hover:#E4E6E10F;--selected:#E4E6E117;--primary:#8A9A52;--on-primary:#0E100C;--link:#B4C47A;--accent:#8A9A52;--on-accent:#0E100C}

const cartN=()=>Object.values(st.cart).reduce((a,b)=>a+b,0), cartSum=()=>Object.entries(st.cart).reduce((a,[k,v])=>a+P[k].p*v,0);

  <button class="user" data-go="cart"><span class="ava num">${cartN()}</span><b>Кошик</b><small class="num">· ${uah(cartSum())}</small><span class="sp"></span><span class="ib" data-act="theme" role="button" tabindex="0" aria-label="Змінити тему" title="Змінити тему">${ic('sun')}</span></button>`;

function bar(){
  const k=kind(), t=k==='article'?A[rid()].t:k==='product'?P[rid()].n:{catalog:'Каталог',kb:'База знань',delivery:'Доставка',cart:'Кошик',search:'Пошук: '+st.q}[k];

const block=(b,i)=>b[0]==='h2'?`<h2 id="h${i}">${b[1]}</h2>`:b[0]==='p'?`<p>${b[1]}</p>`:b[0]==='ul'?`<ul>${b[1].map(x=>`<li>${x}</li>`).join('')}</ul>`:b[0]==='ol'?`<ol>${b[1].map(x=>`<li>${x}</li>`).join('')}</ol>`:b[0]==='note'?`<p class="note">${b[1]}</p>`:`<div class="wrap"><table class="tbl"><thead><tr>${b[1].map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${b[2].map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const prow=(id,hl)=>{const p=P[id];return `<div class="item" data-go="p-${id}" role="link" tabindex="0"><div><b>${hl?hl(p.n):p.n}</b><small><code>${hl?hl(p.sku):p.sku}</code> · ${p.c}</small></div>${stock(p.s)}<span class="price num">${uah(p.p)}</span>${p.s==='none'?'<button class="btn" data-act="prom">Prom</button>':`<button class="btn" data-act="add" data-id="${id}">У кошик</button>`}</div>`};
const alink=(id,hl)=>`<div class="item" data-go="a-${id}" role="link" tabindex="0" style="grid-template-columns:minmax(0,1fr) auto"><div><b>${hl?hl(A[id].t):A[id].t}</b><small>${S.find(s=>s[0]===A[id].s)[1]}</small></div><small class="num">${A[id].m} хв</small></div>`;
function view(){
  const k=kind(), v=$('view'); let h='';

    h=`<p class="meta"><a data-go="kb" class="link" style="color:inherit">База знань</a>${ic('right')}<span>${sec}</span><span>· оновлено 18.11.2026 · текст для прикладу</span></p><article><h1>${a.t}</h1>${a.b.map(block).join('')}
    <div class="acts"><button class="ib" data-act="copy" aria-label="Копіювати посилання" title="Копіювати посилання">${ic('copy')}</button><button class="ib" data-act="pin" data-id="${rid()}" aria-pressed="${st.pins.includes(rid())}" aria-label="Закріпити" title="Закріпити">${ic('pin')}</button><span class="num">${a.m} хв читання</span></div></article>`}
  else if(k==='product'){const p=P[rid()], n=st.cart[rid()]||0, arts=Object.keys(A).filter(a=>A[a].pr.includes(rid()));
    h=`<p class="meta"><a data-go="catalog" class="link" style="color:inherit">Каталог</a>${ic('right')}<span>${p.c}</span><span>· дані для прикладу</span></p><article><h1>${p.n}</h1><p><code>${p.sku}</code></p>
    <div class="buyrow"><span class="big num">${uah(p.p)}</span>${stock(p.s)}${p.s==='none'?'<button class="btn" data-act="prom">Шукати на Prom</button>':n?`<span class="qty"><button data-act="dec" data-id="${rid()}" aria-label="Менше">${ic('minus')}</button><span class="num">${n}</span><button data-act="add" data-id="${rid()}" aria-label="Більше">${ic('plus')}</button></span><button class="btn" data-go="cart">У кошику · перейти</button>`:`<button class="btn primary" data-act="add" data-id="${rid()}">У кошик</button>`}</div>
    <h2>Характеристики</h2><table class="tbl"><tbody>${p.sp.map(([a,b])=>`<tr><td style="color:var(--text-2)">${a}</td><td class="num">${b}</td></tr>`).join('')}</tbody></table>${p.fig?FIG:''}
    ${arts.length?`<h2>Згадується в статтях</h2><div class="items">${arts.map(a=>alink(a)).join('')}</div>`:''}</article>`}
  else if(k==='catalog'){const cats=['Усі',...new Set(Object.values(P).map(p=>p.c))], ids=Object.keys(P).filter(i=>st.cat==='Усі'||P[i].c===st.cat);
    h=`<article><h1>Каталог</h1><div class="chips" role="group" aria-label="Категорія">${cats.map(c=>`<button data-act="cat" data-id="${c}" aria-pressed="${c===st.cat}">${c}</button>`).join('')}</div><div class="items">${ids.map(i=>prow(i)).join('')}</div><p class="meta" style="font-size:13px">${ids.length} з ${Object.keys(P).length} товарів · дані для прикладу</p></article>`}
  else if(k==='kb'){h=`<article><h1>База знань</h1>${S.map(([id,n])=>`<h2>${n}</h2><div class="items">${Object.keys(A).filter(a=>A[a].s===id).map(a=>alink(a)).join('')}</div>`).join('')}</article>`}
  else if(k==='delivery'){h=`<article><h1>Доставка</h1><p>Умови нижче — приклад для прототипу, а не справжні умови магазину.</p><div class="wrap"><table class="tbl"><thead><tr><th>Спосіб</th><th>Строк</th><th>Вартість</th></tr></thead><tbody><tr><td>Відділення перевізника</td><td>1–2 дні</td><td>за тарифом</td></tr><tr><td>Поштомат</td><td>1–2 дні</td><td>за тарифом</td></tr><tr><td>Кур’єр</td><td>1–3 дні</td><td>за тарифом</td></tr></tbody></table></div><p class="note">Літієві акумулятори перевозять лише наземним транспортом.</p></article>`}
  else if(k==='cart'){const ids=Object.keys(st.cart);
    h=`<article><h1>Кошик</h1>${ids.length?`<div class="wrap"><table class="tbl"><thead><tr><th>Товар</th><th>Кількість</th><th>Сума</th></tr></thead><tbody>${ids.map(i=>`<tr><td><a class="link" data-go="p-${i}" style="color:inherit">${P[i].n}</a></td><td><span class="qty"><button data-act="dec" data-id="${i}" aria-label="Менше">${ic('minus')}</button><span class="num">${st.cart[i]}</span><button data-act="add" data-id="${i}" aria-label="Більше">${ic('plus')}</button></span></td><td class="num">${uah(P[i].p*st.cart[i])}</td></tr>`).join('')}</tbody></table></div><div class="buyrow"><span class="big num">${uah(cartSum())}</span><button class="btn primary" data-act="order">Оформити замовлення</button><button class="btn" data-act="clear">Очистити</button></div>`:`<p class="empty">Кошик порожній. Додайте товар із <a class="link" data-go="catalog">каталогу</a> або зі статті.</p>`}</article>`}
  else{const q=st.q.toLowerCase(), hl=s=>{const i=s.toLowerCase().indexOf(q);return i<0?s:esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+q.length))+'</mark>'+esc(s.slice(i+q.length))};
    const as=Object.keys(A).filter(a=>(A[a].t+' '+(A[a].tag||'')).toLowerCase().includes(q)), ps=Object.keys(P).filter(p=>(P[p].n+' '+P[p].sku+' '+P[p].c).toLowerCase().includes(q));
    h=`<article><h1>Результати пошуку</h1><p class="meta">«${esc(st.q)}» · статей ${as.length}, товарів ${ps.length} · Esc, щоб повернутися</p>${as.length?`<h2>Статті</h2><div class="items">${as.map(a=>alink(a,hl)).join('')}</div>`:''}${ps.length?`<h2>Товари</h2><div class="items">${ps.map(p=>prow(p,hl)).join('')}</div>`:''}${as.length+ps.length?'':'<p class="empty">Нічого не знайдено. Спробуйте артикул або параметр: «XT60», «2207», «6S».</p>'}</article>`}
  v.innerHTML=h;
}
function panel(){
  const k=kind(); let h='';
  const buy=id=>`<div class="buy">${ic('box')}<a data-go="p-${id}">${P[id].n}</a><small class="num">${uah(P[id].p)}</small>${P[id].s==='none'?'<span></span>':`<button class="add" data-act="add" data-id="${id}" aria-label="Додати в кошик" title="Додати в кошик">${ic('plus')}</button>`}</div>`;
  const rel=id=>`<div class="buy" style="grid-template-columns:16px minmax(0,1fr)">${ic('doc')}<a data-go="a-${id}">${A[id].t}</a></div>`;
  if(k==='article'){const a=A[rid()], heads=a.b.map((b,i)=>[b,i]).filter(x=>x[0][0]==='h2'), av=a.pr.filter(i=>P[i].s!=='none');
    h=`<section><h2>Стаття</h2><div class="kv">${ic('folder')}<span>${S.find(s=>s[0]===a.s)[1]}</span></div>${a.tag?`<div class="kv">${ic('tag')}<span>${a.tag}</span></div>`:''}<div class="kv">${ic('clock')}<span>Оновлено 18.11.2026</span></div></section>
    ${heads.length?`<section><h2>Зміст</h2><div class="read"><b id="pct" class="num">0% прочитано</b><span class="num">${a.m} хв</span></div><div class="track"><i id="prog"></i></div><nav class="toc" id="toc">${heads.map(([b,i])=>`<a data-toc="h${i}" href="#"><i></i><span>${b[1]}</span></a>`).join('')}</nav></section>`:''}
    ${a.pr.length?`<section><h2>Товари зі статті<small class="num">${av.length} в наявності</small></h2>${a.pr.map(buy).join('')}${av.length>1?`<button class="cta" data-act="addall">У кошик усе · ${uah(av.reduce((s,i)=>s+P[i].p,0))}</button>`:''}</section>`:''}
    ${a.re.length?`<section><h2>Пов’язані статті</h2>${a.re.map(rel).join('')}</section>`:''}`}
  else if(k==='product'){const p=P[rid()], same=Object.keys(P).filter(i=>P[i].c===p.c&&i!==rid());
    h=`<section><h2>Товар</h2><div class="kv">${ic('folder')}<span>${p.c}</span></div><div class="kv">${ic('tag')}<span>${p.sku}</span></div><div class="kv">${ic('box')}<span>${STOCK[p.s]}</span></div></section>${same.length?`<section><h2>У цій категорії</h2>${same.map(buy).join('')}</section>`:''}`}
  const ids=Object.keys(st.cart);
  h+=`<section><h2>Кошик<small class="num">${cartN()} шт.</small></h2>${ids.length?ids.map(i=>`<div class="buy" style="grid-template-columns:minmax(0,1fr) auto auto"><a data-go="p-${i}">${P[i].n}</a><span class="qty"><button data-act="dec" data-id="${i}" aria-label="Менше">${ic('minus')}</button><span class="num">${st.cart[i]}</span><button data-act="add" data-id="${i}" aria-label="Більше">${ic('plus')}</button></span><small class="num">${uah(P[i].p*st.cart[i])}</small></div>`).join('')+`<div class="total"><span>Разом</span><span class="num">${uah(cartSum())}</span></div><button class="cta" data-go="cart">Перейти до кошика</button>`:'<p class="empty">Порожньо</p>'}</section>`;
  $('panel').innerHTML=h; progress();
}
function progress(){
  const sc=$('scroll'), page=getComputedStyle(sc).overflowY==='visible', top=page?scrollY:sc.scrollTop, max=page?document.documentElement.scrollHeight-innerHeight:sc.scrollHeight-sc.clientHeight;
  const p=max>4?Math.min(1,top/max):1, pr=$('prog'); if(!pr)return;
  pr.style.width=p*100+'%'; $('pct').textContent=Math.round(p*100)+'% прочитано';
  const hs=[...document.querySelectorAll('#view h2[id]')]; let on=0; hs.forEach((x,i)=>{if(x.getBoundingClientRect().top<innerHeight*.45)on=i});
  document.querySelectorAll('#toc a').forEach((a,i)=>a.classList.toggle('on',i===on));
}
function draw(top){side();bar();view();panel();if(top){$('scroll').scrollTop=0;if(getComputedStyle($('scroll')).overflowY==='visible')scrollTo(0,0);progress()}}
function go(r){st.q='';$('q').value='';st.route=r;app.classList.remove('drawer');if(location.hash.slice(1)!==r)location.hash=r;else draw(true)}
function valid(r){return ['catalog','kb','delivery','cart'].includes(r)||(r.startsWith('a-')&&A[r.slice(2)])||(r.startsWith('p-')&&P[r.slice(2)])}
addEventListener('hashchange',()=>{const r=location.hash.slice(1);if(valid(r)){st.route=r;const a=A[r.slice(2)];if(r.startsWith('a-')&&a)st.open[a.s]=true;draw(true)}});
const ACT={
 side(){innerWidth<=760?app.classList.toggle('drawer'):app.classList.toggle('noside');bar()},drawer(){app.classList.remove('drawer')},
 panel(){app.classList.toggle('nopanel');bar();if(innerWidth<=760&&!app.classList.contains('nopanel'))$('panel').scrollIntoView()},
 theme(){const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark';say(dark?'Світла тема':'Темна тема')},
 grp(id){id==='pins'?st.open.nopins=!st.open.nopins:st.open[id]=!st.open[id];side()},
 pin(id){const i=st.pins.indexOf(id);i<0?st.pins.unshift(id):st.pins.splice(i,1);say(i<0?'Закріплено: '+A[id].t:'Відкріплено');side();if(kind()==='article')view()},
 add(id){st.cart[id]=(st.cart[id]||0)+1;say('У кошику: '+P[id].n);side();view();panel()},
 dec(id){st.cart[id]>1?st.cart[id]--:delete st.cart[id];say('Кошик оновлено');side();view();panel()},
 addall(){const a=A[rid()].pr.filter(i=>P[i].s!=='none');a.forEach(i=>st.cart[i]=(st.cart[i]||0)+1);say('Додано товарів: '+a.length);side();panel()},
 clear(){st.cart={};say('Кошик очищено');draw()},order(){say('У прототипі оформлення немає')},prom(){say('У прототипі перехід на Prom вимкнено')},
 skin(id){document.documentElement.dataset.skin=id;document.querySelectorAll('.skins button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===id));say({claude:'Варіант: найближчий до Claude',hybrid:'Варіант: суміжний',mine:'Варіант: ваша система'}[id]);progress()},
 cat(id){st.cat=id;view()},focus(){app.classList.remove('drawer');$('q').focus()},
 copy(){const done=()=>say('Посилання скопійовано');(navigator.clipboard?navigator.clipboard.writeText(location.href):Promise.reject()).then(done,()=>say(location.href))}
};
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]'); if(a){e.preventDefault();e.stopPropagation();ACT[a.dataset.act](a.dataset.id);return}
  const t=e.target.closest('[data-toc]'); if(t){e.preventDefault();$(t.dataset.toc).scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'start'});return}
  const g=e.target.closest('[data-go]'); if(g){e.preventDefault();go(g.dataset.go)}
});
document.addEventListener('keydown',e=>{
  const inField=e.target.matches('input,textarea,select,[contenteditable]');
  if(e.key==='/'&&!inField){e.preventDefault();$('q').focus()}
  if(e.key==='Escape'){if(st.q){st.q='';$('q').value='';draw(true)}$('q').blur();app.classList.remove('drawer')}
  if((e.key==='Enter'||e.key===' ')&&!inField&&e.target.matches('[data-go]:not(a):not(button),[data-act]:not(a):not(button)')){e.preventDefault();e.target.click()}
});
$('q').addEventListener('input',e=>{st.q=e.target.value.trim();side();bar();view();panel();$('scroll').scrollTop=0});
$('ask').addEventListener('submit',e=>{e.preventDefault();const f=document.querySelector('#view .item');if(st.q&&f)f.focus()});
$('scroll').addEventListener('scroll',progress,{passive:true});addEventListener('scroll',progress,{passive:true});addEventListener('resize',progress);
if(innerWidth<=760)app.classList.add('nopanel');
ACT.skin('claude');say('');const h0=location.hash.slice(1);if(valid(h0))st.route=h0;draw(true);
</script>
